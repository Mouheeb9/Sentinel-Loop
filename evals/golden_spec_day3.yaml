# Golden-set batch 2 (alerts 41+): which event in which capture gets which label, and why.
#
# DRAFT LABELS: written by Claude, applying docs/labeling-guide.md, for Mouadh to review.
# Each item selects ONE event from a capture (first match unless `nth` is given), so the spec
# is the audit trail: read it, disagree with any line, edit it, re-run evals/mine_candidates.py.
#
# match fields (regex, case-insensitive): kind (process|network|registry), image, cmd, parent,
#   dst ("ip:port"), key, details.
# labels: true_positive (technique = [primary, optional secondary]), benign_noisy, needs_review.
#
# Policy applied from the guide:
#  - true_positive only when the event itself shows adversary behavior;
#  - one weak indicator, or an action an admin could legitimately do -> needs_review (rules 3, 4);
#  - benign_noisy needs checkable context: Microsoft-signed binary in its normal path, expected
#    parent/service, known installed component (Section 1);
#  - sub-technique only when the event shows the mechanism, otherwise the parent (Section 2).

datasets:
  # ---------------------------------------------------------------- credential access
  - name: cmd_dumping_ntds_dit_file_ntdsutil
    items:
      - {label: true_positive, technique: [T1003.003], match: {kind: process, image: 'ntdsutil\.exe$'}, why: "ntdsutil 'ifm' 'create full' snapshots the AD database (ntds.dit) to a temp folder, the standard way to steal domain password hashes."}
      - {label: benign_noisy, match: {kind: process, image: 'CompatTelRunner\.exe$', cmd: 'appraiser\.dll'}, why: "Microsoft compatibility-telemetry runner, signed, in System32, started by its own scheduled task with the standard appraiser.dll argument."}
      - {label: benign_noisy, match: {kind: process, cmd: '-k swprv'}, why: "Volume Shadow Copy provider service host started by services.exe as a side effect of the snapshot, a normal Windows component."}
      - {label: benign_noisy, match: {kind: process, image: 'rundll32\.exe$', cmd: 'SHCreateLocalServerRunDll', parent: 'svchost'}, why: "Windows shell hosting a COM server through rundll32 shell32.dll, launched by svchost, standard OS behavior."}
      - {label: benign_noisy, match: {kind: network, image: 'dns\.exe$', dst: ':53$'}, why: "DNS Server service on a domain controller querying public root servers on port 53, normal recursive resolution."}

  - name: cmd_psexec_lsa_secrets_dump
    items:
      - {label: true_positive, technique: [T1003.004], match: {kind: process, image: 'PsExec\.exe$'}, why: "PsExec -s runs 'reg save HKLM/security/policy/secrets' as SYSTEM, exporting the LSA secrets hive that holds service-account credentials."}
      - {label: true_positive, technique: [T1003.004], match: {kind: process, image: '(^|\\)reg\.exe$', parent: 'PSEXESVC'}, why: "reg.exe started by the PsExec service saves the security/policy/secrets hive to a temp file, dumping LSA secrets."}
      - {label: true_positive, technique: [T1569.002], match: {kind: process, image: 'PSEXESVC\.exe$'}, why: "PSEXESVC.exe started by services.exe is PsExec's remote service, used to run commands as SYSTEM."}

  - name: empire_mimikatz_sam_access
    items: []

  - name: cmd_lsass_memory_dumpert_syscalls
    items:
      - {label: true_positive, technique: [T1003.001], match: {kind: process, image: 'Outflank-Dumpert'}, why: "Outflank-Dumpert is an offensive tool that dumps LSASS memory using direct syscalls to evade EDR hooks."}

  - name: empire_shell_rubeus_asktgt_ptt
    items:
      - {label: true_positive, technique: [T1550.003], match: {kind: process, image: 'Rubeus\.exe$', cmd: 'asktgt'}, why: "Rubeus asktgt with an RC4 hash and /ptt requests a Kerberos ticket and injects it into the session (pass-the-ticket)."}
      - {label: benign_noisy, match: {kind: process, image: 'SearchProtocolHost\.exe$', parent: 'SearchIndexer'}, why: "Windows Search indexer helper launched by SearchIndexer.exe, signed and in System32, routine content indexing."}

  # ---------------------------------------------------------------- defense evasion
  - name: cmd_bitsadmin_download_psh_script
    items:
      - {label: true_positive, technique: [T1197], match: {kind: process, image: 'bitsadmin\.exe$'}, why: "bitsadmin /transfer downloads a PowerShell script from raw.githubusercontent.com, abusing BITS to fetch a payload."}

  - name: cmd_netsh_fw_mod_open_ports
    items:
      - {label: true_positive, technique: [T1686.003], match: {kind: process, image: 'netsh\.exe$', cmd: 'add rule'}, why: "netsh adds an inbound-allow rule for a TCP port named 'atomic testing', opening a hole in the Windows host firewall."}
      - {label: benign_noisy, match: {kind: process, cmd: '-s gpsvc'}, why: "Group Policy Client service host started by services.exe, routine policy processing."}

  - name: covenant_installutil
    items:
      - {label: true_positive, technique: [T1218.004], match: {kind: process, image: 'InstallUtil\.exe$'}, why: "InstallUtil.exe /u runs a payload assembly (GruntHTTP) from ProgramData, proxying execution through a signed .NET binary."}
      - {label: true_positive, technique: [T1059.003], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'GruntHTTP'}, why: "cmd.exe /c spawned by GruntHTTP.exe, a Covenant C2 implant, to launch InstallUtil."}

  - name: empire_launcher_sct_regsvr32
    items:
      - {label: true_positive, technique: [T1218.010], match: {kind: process, image: 'regsvr32\.exe$'}, why: "regsvr32 /s /n /u /i:http://.../launcher.sct scrobj.dll fetches and runs a remote script through a signed binary (Squiblydoo)."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: 'regsvr32'}, why: "PowerShell with -noP -sta -w 1 -enc (encoded stager) spawned by regsvr32."}
      - {label: benign_noisy, match: {kind: process, image: 'backgroundTaskHost\.exe$'}, why: "Windows background task host for an installed app, signed, launched by svchost, normal UWP behavior."}
      - {label: benign_noisy, match: {kind: process, image: 'RuntimeBroker\.exe$'}, why: "RuntimeBroker.exe -Embedding is the signed Windows broker for app permissions, launched by svchost."}

  - name: psh_cmstp_execution_bypassuac
    items:
      - {label: true_positive, technique: [T1218.003], match: {kind: process, image: 'cmstp\.exe$'}, why: "cmstp.exe /s /au with a crafted .inf in ProgramData, named T1218.003_uacbypass, installs a malicious connection profile."}
      - {label: true_positive, technique: [T1548.002], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'dllhost'}, why: "An elevated cmd.exe spawned by DllHost right after cmstp /au is the CMSTP UAC-bypass pattern."}

  - name: psh_mavinject_dll_notepad
    items:
      - {label: true_positive, technique: [T1218.013], match: {kind: process, image: 'mavinject\.exe$'}, why: "mavinject.exe /INJECTRUNNING injects C:/ProgramData/T1055.dll into a running notepad process, proxy DLL injection."}

  - name: wmic_remote_xsl_jscript
    items:
      - {label: true_positive, technique: [T1220], match: {kind: process, image: 'WMIC\.exe$'}, why: "wmic process list /FORMAT:<remote .xsl URL> downloads and executes JScript from a remote stylesheet."}

  - name: psh_hh_local_html_payload
    items:
      - {label: true_positive, technique: [T1218.001], match: {kind: process, image: 'hh\.exe$'}, why: "hh.exe opens C:/ProgramData/T1218.001.chm, a compiled HTML file used to run code through the help viewer."}
      - {label: true_positive, technique: [T1059.003], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'hh\.exe'}, why: "cmd.exe /c spawned by hh.exe: the help viewer launching a shell is not normal behavior."}

  - name: psh_control_panel_execution
    items:
      - {label: true_positive, technique: [T1218.002], match: {kind: process, image: 'control\.exe$'}, why: "control.exe loads C:/ProgramData/calc.cpl, executing a Control Panel item DLL from a non-standard location."}

  - name: psh_register_cimprovider_execute_dll
    items:
      - {label: true_positive, technique: [T1218], match: {kind: process, image: 'Register-CimProvider\.exe$'}, why: "Register-CimProvider.exe -Path C:/ProgramData/T1218-2.dll loads an arbitrary DLL through a signed Windows binary."}

  - name: cmd_wevtutil_modify_security_eventlog_path
    items:
      - {label: true_positive, technique: [T1685.001], match: {kind: process, image: 'wevtutil\.exe$', cmd: 'set-log Security'}, why: "wevtutil set-log Security /logfilename points the Security log at a decoy file name, tampering with event logging."}
      - {label: needs_review, match: {kind: process, image: 'wevtutil\.exe$', cmd: 'get-log Security'}, why: "wevtutil get-log only reads the log configuration, which an admin or an attacker could equally do."}
      - {label: benign_noisy, match: {kind: process, image: 'MpSigStub\.exe$'}, why: "Microsoft Defender signature-update stub started by AM_Delta.exe from Windows Update's download folder, signed, routine."}

  - name: auditpol_system_user_auditpolicy_modification
    items:
      - {label: true_positive, technique: [T1685.001], match: {kind: process, image: 'auditpol\.exe$', cmd: 'DS Access.*success:disable'}, why: "auditpol disables success auditing for the DS Access category for one user, hiding directory activity from the logs."}
      - {label: true_positive, technique: [T1685.001], match: {kind: process, image: 'auditpol\.exe$', cmd: 'Account Logon.*success:disable'}, why: "auditpol turns off success auditing for Account Logon events, blinding logon monitoring."}
      - {label: true_positive, technique: [T1685.001], match: {kind: process, image: 'auditpol\.exe$', cmd: '/remove /user'}, why: "auditpol /remove /user deletes a per-user audit policy, weakening event logging."}
      - {label: needs_review, match: {kind: process, image: 'payload\.exe$', parent: 'explorer'}, why: "A user-launched payload.exe from Downloads is suspicious by name and location, but this single event shows no behavior yet."}

  - name: reg_cmd_process_commandline_logging_disabled
    items:
      - {label: true_positive, technique: [T1685.001], match: {kind: process, image: '(^|\\)reg\.exe$', cmd: 'Policies.System.Audit'}, why: "reg add under Policies/System/Audit changes the process-creation auditing policy, degrading command-line logging."}

  - name: empire_monologue_netntlm_downgrade
    items:
      - {label: true_positive, technique: [T1112], match: {kind: registry, image: 'powershell\.exe$', key: 'NtlmMinClientSec'}, why: "PowerShell writes NtlmMinClientSec under HKLM Lsa MSV1_0, lowering NTLM session security (Internal Monologue downgrade)."}
      - {label: benign_noisy, match: {kind: registry, image: 'DFSRs\.exe$', key: 'Replication Groups'}, why: "DFS Replication service on a domain controller updating its own replication-group configuration, expected on a DC."}

  - name: covenant_lolbin_wuauclt_createremotethread
    items:
      - {label: true_positive, technique: [T1218], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'GruntHTTP', cmd: 'wuauclt'}, why: "cmd.exe /c wuauclt.exe /UpdateDeploymentProvider C:/ProgramData/SimpleInjection.dll makes wuauclt load an attacker DLL, from a C2 implant."}
      - {label: needs_review, match: {kind: process, image: 'notepad\.exe$', parent: 'wuauclt'}, why: "notepad.exe as a child of wuauclt.exe is odd, but a single event does not prove injection."}
      - {label: benign_noisy, match: {kind: network, image: 'dfsrs\.exe$', dst: ':135$'}, why: "DFS Replication service opening an RPC endpoint-mapper connection between domain controllers, normal replication traffic."}

  # ---------------------------------------------------------------- persistence / priv-esc
  - name: cmd_userinitmprlogonscript_batch
    items:
      - {label: true_positive, technique: [T1037.001], match: {kind: process, image: '(^|\\)reg\.exe$'}, why: "reg add HKCU/Environment UserInitMprLogonScript pointing at a .bat in Temp registers a logon script for persistence."}

  - name: cmd_service_mod_fax
    items:
      - {label: true_positive, technique: [T1543.003], match: {kind: process, image: '(^|\\)sc\.exe$', cmd: 'config Fax binPath'}, why: "sc config repoints the Fax service binPath at powershell.exe, modifying a service to run attacker code."}
      - {label: true_positive, technique: [T1569.002], match: {kind: process, image: 'powershell\.exe$', parent: 'services'}, why: "PowerShell run by services.exe as the modified Fax service: the changed service is now executing the payload."}

  - name: empire_persistence_registry_modification_run_keys_elevated_user
    items:
      - {label: true_positive, technique: [T1547.001], match: {kind: registry, image: 'powershell\.exe$', key: 'CurrentVersion.Run.Updater'}, why: "PowerShell writes HKLM Run/Updater, so a program starts at every logon."}

  - name: empire_persistence_registry_modification_run_keys_standard_user
    items:
      - {label: benign_noisy, match: {kind: process, image: 'logman\.exe$', parent: 'WaAppAgent'}, why: "logman stopping GAEvents/RTEvents trace sessions, launched by the Azure VM guest agent WaAppAgent, an installed cloud-management component."}
      - {label: benign_noisy, match: {kind: process, image: 'Upfc\.exe$'}, why: "Windows Update-related upfc.exe started by services.exe with /launchtype boot, signed and in System32."}

  - name: empire_uac_shellapi_fodhelper
    items:
      - {label: true_positive, technique: [T1548.002], match: {kind: process, image: 'fodhelper\.exe$'}, why: "fodhelper.exe started by PowerShell right after the ms-settings command key was hijacked: auto-elevating binary abused for UAC bypass."}
      - {label: true_positive, technique: [T1548.002], match: {kind: registry, image: 'powershell\.exe$', key: 'ms-settings.Shell.Open.command.\(Default\)'}, why: "PowerShell writes the ms-settings/Shell/Open/command default value to run PowerShell, the fodhelper UAC-bypass hijack."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: 'fodhelper'}, why: "Hidden PowerShell (-NoP -NonI -W Hidden) launched by fodhelper.exe, running with elevated rights."}

  # ---------------------------------------------------------------- execution / lateral movement
  - name: empire_launcher_vbs
    items:
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: 'wscript'}, why: "PowerShell -noP -sta -w 1 -enc (encoded stager) spawned by wscript.exe running launcher.vbs."}

  - name: psh_mshta_html_application_execution
    items:
      - {label: true_positive, technique: [T1059.003], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'mshta'}, why: "cmd.exe /c spawned by mshta.exe running an .hta: the HTML application host launching a shell."}

  - name: reg_disable_eventlog_service_startuptype_modification_via_registry
    items:
      - {label: needs_review, match: {kind: process, image: 'payload\.exe$'}, why: "payload.exe launched from Downloads is suspicious by name and path, but this event alone shows no behavior."}

  - name: empire_ninjacopy_dumping_ntds_dit_file
    items:
      - {label: true_positive, technique: [T1204.002], match: {kind: process, image: 'launcher\.exe$', parent: 'explorer'}, why: "launcher.exe run by the user from the Administrator's Desktop is the Empire stager executable."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: 'launcher'}, why: "PowerShell -noP -sta -w 1 -enc (encoded stager) spawned by launcher.exe."}
      - {label: benign_noisy, match: {kind: process, image: 'WerFault\.exe$', cmd: '-pss', parent: 'svchost'}, why: "Windows Error Reporting started by svchost to snapshot a crashed process, signed, in System32."}
      - {label: benign_noisy, match: {kind: process, image: 'wermgr\.exe$'}, why: "Windows Error Reporting manager uploading reports (-upload), signed, launched by svchost."}
      - {label: benign_noisy, match: {kind: process, image: 'MicrosoftEdgeUpdate\.exe$', cmd: '/ua'}, why: "Microsoft Edge updater running its scheduled update-application check, an installed Microsoft component."}
      - {label: benign_noisy, match: {kind: registry, image: 'dwm\.exe$', key: 'Winlogon.PUUActive'}, why: "Desktop Window Manager writing its own Winlogon PUUActive session flag, a standard OS value."}

  - name: empire_psexec_dcerpc_tcp_svcctl
    items:
      - {label: true_positive, technique: [T1569.002], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'services'}, why: "cmd.exe started by services.exe running 'start /b powershell -enc' is a remote service executing an encoded stager (PsExec-style)."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: '(^|\\)cmd\.exe$', cmd: '-enc'}, why: "PowerShell -noP -sta -w 1 -enc (encoded stager) launched by that service-spawned cmd.exe."}
      - {label: benign_noisy, match: {kind: process, image: 'OfficeC2RClient\.exe$'}, why: "Office Click-to-Run updater (/frequentupdate SCHEDULEDTASK), vendor-signed, started by its scheduled task."}
      - {label: benign_noisy, match: {kind: network, image: 'MicrosoftSearchInBing\.exe$'}, why: "Microsoft Search in Bing, a Microsoft-signed installed app, connecting to Microsoft's CDN over HTTPS."}

  - name: empire_wmi_dcerpc_wmi_IWbemServices_ExecMethod
    items:
      - {label: true_positive, technique: [T1047], match: {kind: process, image: 'powershell\.exe$', parent: 'WmiPrvSE'}, why: "PowerShell -enc spawned by WmiPrvSE.exe is remote WMI method execution running an encoded stager."}
      - {label: benign_noisy, match: {kind: process, image: 'UsoClient\.exe$'}, why: "Windows Update Session Orchestrator client (StartUWork), signed, launched by svchost."}

  - name: empire_msbuild_dcerpc_wmi_smb
    items:
      - {label: true_positive, technique: [T1047], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'WmiPrvSE'}, why: "cmd.exe /c MSBuild.exe pshell.xml spawned by WmiPrvSE means the build command was started through WMI."}
      - {label: true_positive, technique: [T1127.001], match: {kind: process, image: 'MSBuild\.exe$', cmd: 'pshell\.xml'}, why: "MSBuild.exe builds C:/Windows/Tasks/pshell.xml, a project with an inline task, to run code through a trusted developer tool."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: 'MSBuild'}, why: "PowerShell -enc launched by MSBuild.exe, the payload of the inline task."}

  - name: empire_shell_net_local_users
    items:
      - {label: true_positive, technique: [T1087.001], match: {kind: process, image: '(^|\\)net\.exe$'}, why: "net user run from PowerShell enumerates local accounts."}
      - {label: benign_noisy, match: {kind: process, image: 'sppsvc\.exe$'}, why: "Software Protection Platform service started by services.exe for licensing checks, signed, System32."}

  - name: cmd_discover_iexplorer_version_registry
    items:
      - {label: needs_review, match: {kind: process, image: '(^|\\)reg\.exe$'}, why: "reg query of the Internet Explorer svcVersion value is a single weak discovery indicator that admin and inventory tools do too."}

  - name: cmd_process_herpaderping_snippingtool
    items:
      - {label: true_positive, technique: [T1055], match: {kind: process, image: 'ProcessHerpaderping\.exe$'}, why: "ProcessHerpaderping.exe mimikatz.exe ... SnippingTool.exe builds a process from mimikatz whose on-disk image is swapped to look benign."}
      - {label: true_positive, technique: [T1055], match: {kind: process, image: 'wardog\.exe$'}, why: "wardog.exe is the herpaderped process, running mimikatz code under a benign-looking image."}

  - name: cmd_seatbelt_group_user
    items:
      - {label: needs_review, match: {kind: process, image: 'Seatbelt\.exe$'}, why: "Seatbelt is a known offensive host-survey tool, but -group=user runs many checks so no single technique can be pinned from this event."}

  - name: covenant_psremoting_command
    items:
      - {label: needs_review, match: {kind: process, image: 'wsmprovhost\.exe$'}, why: "wsmprovhost.exe means an inbound WinRM session, which is normal for admins; nothing in this event shows it is malicious."}

  - name: covenant_wmi_remote_event_subscription_ActiveScriptEventConsumers
    items:
      - {label: true_positive, technique: [T1546.003], match: {kind: process, image: 'MoveWMI\.exe$'}, why: "MoveWMI.exe <IP> is a tool that installs a WMI event subscription on a remote host."}
      - {label: true_positive, technique: [T1546.003], match: {kind: process, image: 'scrcons\.exe$'}, why: "scrcons.exe, the WMI script event-consumer host, launched by svchost: a WMI ActiveScript consumer is executing."}

  - name: covenant_sharpwmi_create_dcerpc_wmi
    items:
      - {label: true_positive, technique: [T1047], match: {kind: process, image: 'GruntHTTP2\.exe$', parent: 'WmiPrvSE'}, why: "GruntHTTP2.exe, a Covenant implant, started by WmiPrvSE means a process was created remotely through WMI."}

  - name: covenant_dcom_registerxll
    items:
      - {label: true_positive, technique: [T1021.003, T1137.006], match: {kind: process, image: 'MoveExcelXLL\.exe$'}, why: "MoveExcelXLL.exe <IP> calc.xll uses DCOM to make a remote Excel load an XLL add-in."}
      - {label: true_positive, technique: [T1059.003], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'GruntHTTP'}, why: "cmd.exe /c MoveExcelXLL.exe spawned by GruntHTTP.exe, a Covenant C2 implant."}

  - name: empire_smbexec_dcerpc_smb_svcctl
    items:
      - {label: true_positive, technique: [T1569.002], match: {kind: process, image: '(^|\\)cmd\.exe$', parent: 'services', cmd: 'start /b'}, why: "cmd.exe /C ... start /b powershell -enc started by services.exe is remote service execution (smbexec) of an encoded stager."}
      - {label: true_positive, technique: [T1059.001], match: {kind: process, image: 'powershell\.exe$', parent: '(^|\\)cmd\.exe$', cmd: '-enc'}, why: "PowerShell -noP -sta -w 1 -enc (encoded stager) launched by the service-spawned cmd.exe."}
      - {label: benign_noisy, match: {kind: process, image: 'CollectGuestLogs\.exe$'}, why: "Azure VM guest-agent log collector (CollectGuestLogs) launched by WaAppAgent.exe, an installed cloud-management component."}

  - name: schtask_create
    items:
      - {label: true_positive, technique: [T1053.005], match: {kind: process, image: 'schtasks\.exe$', cmd: 'EventCacheManager'}, why: "schtasks /create names a task under SoftwareProtectionPlatform/EventCacheManager to blend in with a Windows component."}
      - {label: benign_noisy, match: {kind: process, image: 'cscript\.exe$', parent: 'MonitoringHost'}, why: "cscript running MonitorKnowledgeDiscovery.vbs from MonitoringHost.exe, the Microsoft monitoring agent, a known installed application."}

  - name: empire_shell_dcerpc_smb_service_dll_hijack
    items:
      - {label: needs_review, match: {kind: process, image: '(^|\\)sc\.exe$', cmd: 'start IKEEXT'}, why: "sc starting a service on a remote host can be admin work or the trigger of a DLL-hijack, and this event alone cannot tell which."}
      - {label: benign_noisy, match: {kind: process, image: 'SDXHelper\.exe$', cmd: 'Embedding'}, why: "Microsoft Office SDX helper started as a COM server (-Embedding) by svchost from the Office16 install folder, vendor-signed."}
      - {label: benign_noisy, match: {kind: network, image: 'SDXHelper\.exe$', dst: ':443$'}, why: "Microsoft Office SDX helper connecting to Microsoft cloud on 443, telemetry and content refresh."}

  - name: empire_wmic_add_user_backdoor
    items:
      - {label: true_positive, technique: [T1047], match: {kind: process, image: 'WMIC\.exe$', cmd: '/node'}, why: "wmic /node:WORKSTATION6 process call create runs a command on a remote host over WMI."}
      - {label: true_positive, technique: [T1136.001], match: {kind: process, image: '(^|\\)net\.exe$', parent: 'WmiPrvSE'}, why: "net user /add backdoor creates a local account, started through WMI on a remote host."}
      - {label: benign_noisy, match: {kind: process, image: 'gpupdate\.exe$'}, why: "gpupdate /target:computer is a Group Policy refresh started by svchost, Microsoft-signed in System32."}

  - name: aptsimulator_cobaltstrike
    items:
      - {label: true_positive, technique: [T1134.001], match: {kind: process, image: 'CreateNamedPipe\.exe$', cmd: 'MSSE-1337'}, why: "CreateNamedPipe.exe creating a pipe named MSSE-1337-server matches the Cobalt Strike getsystem named-pipe pattern."}
      - {label: true_positive, technique: [T1134.001], match: {kind: process, image: 'CreateNamedPipe\.exe$', cmd: 'msagent_'}, why: "A pipe named msagent_<hex> is a default Cobalt Strike named-pipe name used for token impersonation and beacon IPC."}
      - {label: needs_review, match: {kind: process, image: '7z\.exe$'}, why: "7z extracting a password-protected archive is ordinary for admins and for attackers, and this event alone cannot tell which."}

  - name: psh_python_webserver
    items:
      - {label: needs_review, match: {kind: process, image: 'python\.exe$', cmd: 'http\.server'}, why: "python -m http.server can be a developer's quick file share or attacker staging, and nothing in this event distinguishes them."}
      - {label: needs_review, match: {kind: process, image: 'netsh\.exe$', cmd: 'add rule'}, why: "An inbound-allow firewall rule for python.exe could be a developer opening a port or an attacker, and this event alone cannot tell which."}

  - name: empire_over_pth_patch_lsass
    items:
      - {label: needs_review, match: {kind: process, image: 'whoami\.exe$'}, why: "whoami /user is a common identity check run by admins and attackers alike."}

