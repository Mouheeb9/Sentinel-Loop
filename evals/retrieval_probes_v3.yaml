# Retrieval probe set v3 — written from real golden alert behaviour (Day 11 task).
#
# v1 (ATT&CK knowledge) and v2 (held out for the lexical leg) are SPENT: both were tuned against.
# v3 is written the other way round: each query describes what one real golden alert shows, in
# the words an analyst would use, not ATT&CK text. `source` is that alert; `expected` is its
# golden-v1.1 label (human-reviewed by Mouadh).
#
# Leakage rules:
#   - Sources come only from golden true_positive alerts in NEITHER split-v1 dev NOR test, so
#     tuning retrieval on v3 can't leak into the triage dev/test numbers.
#   - No query repeats a v1/v2 behaviour (lsass handle dump, Run key, ntdsutil, netsh firewall,
#     bitsadmin, net user /add, remote mshta were skipped for that reason).
#
# Status: DRAFTED 2026-10-03 (Mouadh with Claude). Mouadh reviews every query against its source
# alert, then sets FROZEN below and records the sha256. NOTHING has been run on it: no retrieval,
# no eval. After freezing, do not edit queries or expected IDs; a wrong probe gets a dated note.
#
# FROZEN: no
#
# Scoring rules (pre-registered, same as v1/v2):
#   primary   recall@5, technique chunks only, exact ID match.
#   lenient   recall@5, technique chunks only, parent/child counts (T1218 <-> T1218.010).
#   mixed     recall@5 over technique + Sigma chunks, a Sigma rule counts through its tags.
# Tags: id = names a tool or a literal command; behaviour = describes what happens without the
# telling keyword; multi = two techniques are both correct.

