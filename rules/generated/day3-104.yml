title: PowerShell Encoded Command with Hidden Window and No Profile
id: 81d1e00f-872c-590c-bfa7-4f451dff2a34
status: experimental
description: Detects PowerShell execution with a base64-encoded command (-enc) combined
  with -NoProfile, -STA, and hidden window style (-w 1 / -WindowStyle Hidden). This
  combination is strongly associated with staged malware downloaders that disable
  AMSI/ETW and fetch/execute payloads.
author: Sentinel Loop rule_gen v0
date: '2026-10-21'
tags:
- attack.t1059.001
- attack.t1562.001
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection1_1:
    Image|endswith:
    - powershell.exe
    - pwsh.exe
    CommandLine|contains:
    - -enc
    - -e
    - -encodedcommand
    - -encodedCommand
  selection1_2:
    CommandLine|contains:
    - -nop
    - -noprofile
    - -noP
  selection1_3:
    CommandLine|contains:
    - -w 1
    - -w  1
    - -windowstyle hidden
    - -windowstyle 1
  selection1_4:
    CommandLine|contains:
    - -sta
  condition: all of selection1_*
falsepositives:
- Legitimate administrative scripts using encoded commands with hidden window and
  no profile (rare)
level: high
