# Procedure ids for golden true_positive alerts (validator v2). Owner: Mouadh.
#
# A technique says WHAT the attacker achieved; a procedure says HOW. Two alerts with the same
# technique can share no field a rule could match on (day2-006 vs day3-053 below), so the
# validator v2 requires a rule to catch the same procedure, and only reports the others.
#
# Format: alert_id: <technique id>/<short-kebab-name>
# - alert_id must be a golden v1.1 true_positive
# - the technique part must be one of that row's technique_ids
# - labels stay in v1.1.jsonl untouched; this file only groups them
# - same procedure = same method AND the event shows the same step (a tool launch and the process
#   it later creates are two procedures: one rule can't catch both)
# Rows not listed here are their own procedure (counted as "no same-procedure positive").
# Covers every TP whose primary technique has >=2 golden TPs (80 rows, 23 techniques).
# Status: drafted 2026-10-06 from the v1.1 rationales; verified by Mouadh against the events 2026-10-06.
# Checked by tests/test_procedures.py.

