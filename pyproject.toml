[project]
name = "sentinel-loop"
version = "0.1.0"
description = "Closed-loop AI detection engineering: triage alerts, map to ATT&CK, generate and validate Sigma rules, red-team the pipeline against prompt injection."
readme = "README.md"
authors = [
    { name = "Mouheb", email = "mouhebbezi5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
sentinel-loop = "sentinel:main"

[tool.uv.build-backend]
module-name = "sentinel"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pysigma-backend-elasticsearch>=2.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "sigma-cli>=3.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["NotionProject"]  # exported Notion pages, not code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
